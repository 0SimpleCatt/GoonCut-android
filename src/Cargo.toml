[workspace]
resolver = "3"
members = ["crates/*", "crates/capcraft-android/bindgen"]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"  # + plugin exception, see LICENSE-EXCEPTIONS.md

[workspace.dependencies]
concat-core = { path = "crates/concat-core" }
concat-media = { path = "crates/concat-media" }
concat-project = { path = "crates/concat-project" }
concat-render = { path = "crates/concat-render" }
concat-export = { path = "crates/concat-export" }
concat-host = { path = "crates/concat-host" }
concat-speech = { path = "crates/concat-speech" }
concat-effects = { path = "crates/concat-effects" }
concat-text = { path = "crates/concat-text" }
concat-vision = { path = "crates/concat-vision" }

serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

# The GPU compositor, behind concat-render's `gpu` feature. A heavy tree, which
# is exactly why it is optional: engine-only work never pays for it. Pinned to
# the major Slint 1.17 can share a device with, so the window's renderer and
# the engine's compositor draw on one device and a preview frame never leaves
# the GPU.
wgpu = "30"
pollster = "0.4"

# ONNX Runtime, for the cutout models. The binaries come prebuilt for every
# target the app ships on, with the platform's own accelerator behind them:
# CoreML on macOS and iOS, DirectML on Windows, NNAPI on Android.
ort = "=2.0.0-rc.13"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Cleverness is the enemy of a codebase you maintain alone.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Decoding and compositing are unusably slow in an unoptimised build, even when
# the rest of the engine is being debugged.
[profile.dev.package."*"]
opt-level = 2

# No incremental caches for the everyday check-and-test builds; see
# .cargo/config.toml for why it is said here and not there.
[profile.dev]
incremental = false

[profile.test]
incremental = false
