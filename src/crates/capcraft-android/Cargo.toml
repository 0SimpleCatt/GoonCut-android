[package]
name = "capcraft-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "CapCraft on phones: Concat's engine as a native library with Kotlin bindings (UniFFI); the Android app is in android/."

[lib]
name = "capcraft_android"
# cdylib: the library the Android app loads; lib: the host tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
concat-core.workspace = true
concat-project.workspace = true
concat-media.workspace = true
concat-export.workspace = true
concat-effects.workspace = true
concat-host.workspace = true
concat-text.workspace = true
concat-speech.workspace = true
concat-vision.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
log = { version = "0.4", features = ["std"] }
# Freeze-frame stills are written as PNG: lossless, the frame as it was.
png = "0.17"
# MIT OR Apache-2.0. GIF export (src/gif.rs), at the version already in the tree.
gif = "0.14"
# MPL-2.0. The exact version: the Kotlin bindings are generated by the same
# release (bindgen/, a workspace member sharing this lock file) and refuse to
# load against another one.
uniffi = { version = "=0.32.2", default-features = false }

# Isolate voice (src/voice.rs): k2-fsa's speech denoiser, through the bindings
# concat-speech already links (Apache-2.0), linked the same way it does: the
# static library on the desktop Unixes, the shared one on the phones.
[target.'cfg(not(any(windows, target_os = "android", target_os = "ios")))'.dependencies]
sherpa-onnx = "1.13"

[target.'cfg(any(windows, target_os = "android", target_os = "ios"))'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

# The engine's log in logcat; the Java VM and context the sound device needs
# (see src/android.rs), at the versions already in the tree.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
jni-sys = "0.3"
ndk-context = "0.1"
