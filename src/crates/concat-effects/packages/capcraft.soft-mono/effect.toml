format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.soft-mono"
name = "Soft Mono"
version = 1
kind = "filter"
category = "Black & White"
order = 101
intensity = "amount"
description = "Gentle black and white, the blacks lifted to a soft grey like an old print."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
