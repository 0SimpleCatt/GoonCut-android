format = 2

# CapCraft's bubbles. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.bubbles"
name = "Bubbles"
version = 1
kind = "effect"
category = "Dreamy"
order = 81
intensity = "amount"
description = "Soft bubbles drift up the picture, each a pale ring with a bright rim and a glint."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "size"
label = "Size"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
