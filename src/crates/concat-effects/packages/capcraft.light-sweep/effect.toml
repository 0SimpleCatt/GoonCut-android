format = 2

# CapCraft's light sweep. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.light-sweep"
name = "Light Sweep"
version = 1
kind = "effect"
category = "Light"
order = 87
intensity = "amount"
description = "A band of light sweeps across the picture on a slant every few seconds, a shine across glass."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
