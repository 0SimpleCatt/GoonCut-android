format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.city-lights"
name = "City Lights"
version = 1
kind = "filter"
category = "Night"
order = 110
intensity = "amount"
description = "Night streets: lamps warmed and lifted, shadows cooled to blue."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
