format = 2

# CapCraft's zoom away. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.zoom-away"
name = "Zoom Away"
version = 1
kind = "effect"
category = "Intro & Outro"
order = 101
description = "The clip pushes in about its middle as it ends."

# How long the outro takes, up to the last frame of the clip or layer it is on.
[[param]]
key = "span"
label = "Duration"
min = 0.2
max = 3
default = 0.8
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
