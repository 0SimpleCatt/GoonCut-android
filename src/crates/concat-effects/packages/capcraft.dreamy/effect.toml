format = 2

# CapCraft's dreamy. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.dreamy"
name = "Dreamy"
version = 1
kind = "effect"
category = "Dreamy"
order = 86
intensity = "amount"
description = "The picture softened by a gentle glow, lifted and washed with a pastel tint that drifts."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
