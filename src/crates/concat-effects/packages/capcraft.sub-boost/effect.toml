# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.sub-boost"
name = "Sub Boost"
kind = "audio"
category = "Tone"
order = 96
intensity = "boost"
description = "A deeper floor under the sound, the lowest notes thickened."

[[param]]
key = "boost"
label = "Boost"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "asubboost=dry=1:wet={fixed(0.2 + boost * 0.06, 2)}:decay=0.6:feedback=0.5:cutoff=100,alimiter=limit=0.92"
