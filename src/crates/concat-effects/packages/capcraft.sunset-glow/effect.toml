format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.sunset-glow"
name = "Sunset Glow"
version = 1
kind = "filter"
category = "Scenery"
order = 91
intensity = "amount"
description = "The last hour of the day: warm, gold highlights and a rose tint in the shadows."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
