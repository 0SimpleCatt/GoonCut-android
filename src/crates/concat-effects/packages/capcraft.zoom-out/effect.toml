format = 2

# CapCraft's zoom out. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.zoom-out"
name = "Zoom Out"
version = 1
kind = "effect"
category = "Intro & Outro"
order = 95
description = "The clip starts close in and pulls back to its full frame."

# How long the intro takes, from the first frame of the clip or layer it is on.
[[param]]
key = "span"
label = "Duration"
min = 0.2
max = 3
default = 0.8
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
