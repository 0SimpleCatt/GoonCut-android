format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.forest"
name = "Forest"
version = 1
kind = "filter"
category = "Scenery"
order = 92
intensity = "amount"
description = "Deep, lush greens, the yellows turned toward them, a little more depth."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
