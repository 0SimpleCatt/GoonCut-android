[wgsl]
entry = "effect.wgsl"
space = "display"

# The light blurred wide, across the rows then down the columns, for
# clarity to measure each part against; drawn at a sliver when clarity is
# off, as nothing reads it then.
[[wgsl.pass]]
target = "across"
shrink = ["if(clarity * clarity < 1, 64, 4)", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["if(clarity * clarity < 1, 64, 4)", "if(clarity * clarity < 1, 64, 4)"]
