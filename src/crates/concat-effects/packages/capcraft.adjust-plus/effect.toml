format = 2

# CapCraft's further adjustments, beside the engine's Adjust: brilliance,
# clarity, grain, and hue, saturation and lightness for eight bands of
# colour. Set from the Adjust tab, never listed. Written for CapCraft for
# Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.adjust-plus"
name = "More Adjustments"
version = 1
kind = "filter"
category = "Adjust"
order = 1
intensity = "clarity"
description = "Brilliance, clarity, grain and the colour bands of HSL, beside Adjust."

# Brilliance lifts the shadows and low middles and eases the upper middles,
# black and white staying where they are; below zero the other way.
[[param]]
key = "brilliance"
label = "Brilliance"
min = -100
max = 100
default = 0
step = 1
unit = "%"

# Clarity: contrast between each part of the picture and what is around it,
# strongest in the middle tones.
[[param]]
key = "clarity"
label = "Clarity"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 0
step = 1
unit = "%"

