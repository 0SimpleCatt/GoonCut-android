format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.streetlamp"
name = "Streetlamp"
version = 1
kind = "filter"
category = "Night"
order = 113
intensity = "amount"
description = "The orange of sodium lamps over everything, the shadows deep."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
