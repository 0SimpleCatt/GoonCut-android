format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.berry"
name = "Berry"
version = 1
kind = "filter"
category = "Food"
order = 94
intensity = "amount"
description = "Fruit at its ripest: reds and magentas richer, a cool, clean background."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
