# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.vibrato"
name = "Vibrato"
kind = "audio"
category = "Voice"
order = 82
intensity = "rate"
description = "A wavering voice, its pitch rising and falling a little many times a second."

[[param]]
key = "rate"
label = "Rate"
min = 0
max = 10
default = 4
step = 0.5

[ffmpeg]
chain = "vibrato=f={fixed(3 + rate * 0.7, 1)}:d=0.5,alimiter=limit=0.95"
