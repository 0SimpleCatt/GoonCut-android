format = 2

# CapCraft's star. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.star"
name = "Star"
version = 1
kind = "transition"
category = "Mask"
order = 41
description = "A five-pointed star opens from the middle onto the incoming shot, turning as it grows."

[[param]]
key = "softness"
label = "Softness"
type = "int"
min = 0
max = 100
default = 15
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "circleopen"
fallback = "cross-fade"
