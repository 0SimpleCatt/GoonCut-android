# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.kid"
name = "Kid"
kind = "audio"
category = "Voice"
order = 102
intensity = "height"
description = "A younger, lighter voice: the pitch raised a little, the pace kept."

[[param]]
key = "height"
label = "Height"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
let = [
  "ratio = pow(2, (2 + height * 0.4) / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},alimiter=limit=0.94"
