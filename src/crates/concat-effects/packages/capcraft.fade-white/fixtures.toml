# A cut from one colour to another, a little over a third of the way:
# the outgoing colour most of the way to white, the longer the hold the
# further. Pinned from a model of the shader in doubles.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.975002, 0.937505, 0.912507, 1.0]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.96647, 0.916176, 0.882646, 1.0]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [1.0, 1.0, 1.0, 1.0]
