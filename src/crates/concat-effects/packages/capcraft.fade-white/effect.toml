format = 2

# CapCraft's dip to white. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.fade-white"
name = "Fade White"
version = 1
kind = "transition"
category = "Basic"
order = 31
description = "The outgoing shot fades to white and the incoming one fades up out of it."

[[param]]
key = "hold"
label = "Hold"
type = "int"
min = 0
max = 100
default = 10
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "fadewhite"
fallback = "cross-fade"
