# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from the shader as first written, so the look stays
# what it was.

[[probe]]
name = "default, skin"
input = [0.6, 0.35, 0.25, 1]
expect = [0.56006, 0.43335, 0.30127, 1.0]

[[probe]]
name = "default, a sky"
input = [0.1, 0.25, 0.6, 1]
expect = [0.21655, 0.21802, 0.20801, 1.0]

[[probe]]
name = "minimum, as shot"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.45, 0.4, 0.35, 1]

[[probe]]
name = "maximum, foliage"
at = "max"
input = [0.12, 0.3, 0.08, 1]
expect = [0.20557, 0.17017, 0.11761, 1.0]
