format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.golden-noir"
name = "Golden Noir"
version = 1
kind = "filter"
category = "Movies"
order = 109
intensity = "amount"
description = "Black and white warmed to old gold, hard and glowing."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
