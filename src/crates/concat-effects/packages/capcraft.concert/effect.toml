# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.concert"
name = "Concert"
kind = "audio"
category = "Space"
order = 93
intensity = "size"
description = "A stage in a concert hall: close reflections, then the room answering."

[[param]]
key = "size"
label = "Size"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aecho=0.8:0.7:{fixed(60 + size * 6, 0)}|{fixed(120 + size * 12, 0)}|{fixed(200 + size * 20, 0)}:0.35|0.25|0.18,equalizer=f=200:t=q:w=1:g=1.5,alimiter=limit=0.94"
