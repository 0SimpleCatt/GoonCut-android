format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.porcelain"
name = "Porcelain"
version = 1
kind = "filter"
category = "Portrait"
order = 96
intensity = "amount"
description = "Bright and airy: lighter, colour softened, a cool hint in the shadows."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
