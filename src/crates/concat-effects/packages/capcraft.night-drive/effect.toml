format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.night-drive"
name = "Night Drive"
version = 1
kind = "filter"
category = "Cinematic"
order = 98
intensity = "amount"
description = "City lights after dark: teal shadows, crushed blacks, warm lamps."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
