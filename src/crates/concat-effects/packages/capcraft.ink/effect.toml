format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.ink"
name = "Ink"
version = 1
kind = "filter"
category = "Black & White"
order = 100
intensity = "amount"
description = "Hard black and white through a red filter: dark skies, bright skin, deep blacks."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
