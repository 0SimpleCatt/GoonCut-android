# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.air"
name = "Air"
kind = "audio"
category = "Tone"
order = 97
intensity = "amount"
description = "The top of the sound lifted and given sparkle, so a voice sounds close and clear."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aexciter=amount={fixed(1 + amount * 0.3, 1)}:drive=8.5:freq=7500,alimiter=limit=0.94"
