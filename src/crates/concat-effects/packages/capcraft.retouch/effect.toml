format = 2

# CapCraft's retouch: skin smoothed and brightened, the rest of the picture
# left as it is. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.retouch"
name = "Retouch"
version = 1
kind = "effect"
category = "Cutout"
order = 65
intensity = "soften"
description = "Smooths and brightens skin, telling it from the rest of the picture by its colour."

[[param]]
key = "soften"
label = "Smooth"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "brighten"
label = "Brighten"
type = "int"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
