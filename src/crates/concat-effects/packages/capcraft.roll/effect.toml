format = 2

# CapCraft's roll. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.roll"
name = "Roll"
version = 1
kind = "transition"
category = "Spin"
order = 45
description = "The picture rolls round, zooming in, and comes back upright on the incoming shot."

[[param]]
key = "turn"
label = "Turn"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "radial"
fallback = "cross-fade"
