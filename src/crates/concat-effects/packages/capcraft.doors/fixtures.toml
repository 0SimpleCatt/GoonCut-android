# A cut from one colour to another, a little over a third of the way: the
# doors have opened past the probed pixel just right of the middle, which
# shows the incoming colour shaded by how near a door's edge it is. Pinned
# from a model of the shader in doubles.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.048023, 0.144068, 0.384181, 1.0]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.05, 0.15, 0.4, 1.0]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.046045, 0.138136, 0.368361, 1.0]
