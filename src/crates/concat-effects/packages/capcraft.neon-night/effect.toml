format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.neon-night"
name = "Neon Night"
version = 1
kind = "filter"
category = "Vibe"
order = 103
intensity = "amount"
description = "Club colours: magenta and cyan pushed, the rest dark and glossy."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
