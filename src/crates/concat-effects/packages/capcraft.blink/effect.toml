format = 2

[effect]
id = "capcraft.blink"
name = "Blink"
version = 1
kind = "effect"
category = "Light"
order = 34
intensity = "amount"
description = "The picture going dark and coming back in a steady beat, like a light switched off and on."

[[param]]
key = "amount"
label = "Darkness"
type = "int"
min = 0
max = 100
default = 85
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Blinks a second"
min = 0.5
max = 8
default = 2
step = 0.5

[wgsl]
entry = "effect.wgsl"
