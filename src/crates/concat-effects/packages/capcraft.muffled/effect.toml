# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.muffled"
name = "Muffled"
kind = "audio"
category = "Space"
order = 92
intensity = "muffle"
description = "The sound from behind a closed door: dull, the highs gone."

[[param]]
key = "muffle"
label = "Muffle"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowpass=f={fixed(1600 - muffle * 110, 0)},lowpass=f={fixed(1600 - muffle * 110, 0)},volume=1.2,alimiter=limit=0.94"
