# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.orbit"
name = "Orbit"
kind = "audio"
category = "Voice"
order = 103
intensity = "drift"
description = "A voice from a space station: shifted a touch, metallic, with a short echo."

[[param]]
key = "drift"
label = "Drift"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "afreqshift=shift={fixed(20 + drift * 12, 0)},aecho=0.8:0.5:60:0.35,highpass=f=200,alimiter=limit=0.94"
