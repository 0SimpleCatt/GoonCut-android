# A cut from one colour to another, a little over a third of the way: each
# slat shows the incoming colour down to a little over a third of its
# height. The probed pixel falls low in its slat at the default, and high
# in it with the fewest and the most slats. Pinned from a model of the
# shader in doubles.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.8, 0.5, 0.3, 1.0]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.05, 0.15, 0.4, 1.0]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1.0]
to = [0.05, 0.15, 0.4, 1.0]
progress = 0.37
expect = [0.05, 0.15, 0.4, 1.0]
