format = 2

# CapCraft's spotlight. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.spotlight"
name = "Spotlight"
version = 1
kind = "effect"
category = "Light"
order = 85
intensity = "amount"
description = "A spotlight sweeps the picture in a slow figure of eight, the rest falling into shadow."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
