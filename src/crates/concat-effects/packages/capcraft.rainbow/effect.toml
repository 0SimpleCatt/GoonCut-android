format = 2

[effect]
id = "capcraft.rainbow"
name = "Rainbow"
version = 1
kind = "effect"
category = "Stylize"
order = 7
intensity = "amount"
description = "Every colour of the picture turned round the colour wheel, in a sweep that rolls across it."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 2
default = 0.4
step = 0.1

[wgsl]
entry = "effect.wgsl"
space = "display"
