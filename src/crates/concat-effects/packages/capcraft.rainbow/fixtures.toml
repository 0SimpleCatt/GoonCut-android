# The probe pixel of the first frame: the hue turn there worked out from the
# prelude's YIQ turn, mixed by the amount, in the display encoding.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a red"
input = [0.6, 0.05, 0.03, 1]
expect = [0.0820721, 0.1918, 0.0632188, 1]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.20438, 0.297079, 0.210533, 0.5]

[[probe]]
name = "min, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "min, a red"
at = "min"
input = [0.6, 0.05, 0.03, 1]
expect = [0.6, 0.05, 0.03, 1]

[[probe]]
name = "min, half transparent"
at = "min"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "max, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "max, a red"
at = "max"
input = [0.6, 0.05, 0.03, 1]
expect = [0.000726223, 0.350727, 0.0936665, 1]

[[probe]]
name = "max, half transparent"
at = "max"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.086486, 0.374519, 0.311811, 0.5]
