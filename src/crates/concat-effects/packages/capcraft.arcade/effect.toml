# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.arcade"
name = "Arcade"
kind = "audio"
category = "Tone"
order = 87
intensity = "crush"
description = "The coarse, stepped sound of an old games machine."

[[param]]
key = "crush"
label = "Crush"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowpass=f=6000,acrusher=bits={fixed(12 - crush * 0.8, 0)}:mode=lin:mix=0.9,alimiter=limit=0.9"
