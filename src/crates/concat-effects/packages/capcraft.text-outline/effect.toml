format = 2

# CapCraft's text outline: a second, outer line round a title's letters in a
# chosen colour, set from the text panel's Effects tab. Written for CapCraft
# for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.text-outline"
name = "Text Outline"
version = 1
kind = "effect"
category = "Text"
order = 71
intensity = "width"
description = "A second, outer line round a title's letters in a chosen colour."

# Black, fully opaque.
[[param]]
key = "color"
label = "Colour"
type = "color"
min = 0
max = 4294967295
default = 255

[[param]]
key = "width"
label = "Width"
type = "int"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
