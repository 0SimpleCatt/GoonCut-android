format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.pastel"
name = "Pastel"
version = 1
kind = "filter"
category = "Vibe"
order = 102
intensity = "amount"
description = "Chalky, dreamy colour: faded, softened and blushed pink in the light."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
