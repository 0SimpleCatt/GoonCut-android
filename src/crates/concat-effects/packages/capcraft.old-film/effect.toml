format = 2

[effect]
id = "capcraft.old-film"
name = "Old Film"
version = 1
kind = "effect"
category = "Retro"
order = 6
intensity = "tone"
description = "A worn print: brown tones, grain that never holds still, a flicker, dark corners and the odd scratch."

[[param]]
key = "tone"
label = "Tone"
type = "int"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
type = "int"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
