# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.tunnel"
name = "Tunnel"
kind = "audio"
category = "Space"
order = 100
intensity = "size"
description = "A narrow, ringing passage: close, quick echoes and a hollow tone."

[[param]]
key = "size"
label = "Size"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aecho=0.8:0.8:{fixed(25 + size * 4, 0)}|{fixed(50 + size * 8, 0)}:0.5|0.35,bandpass=f=900:width_type=o:w=3,volume=1.5,alimiter=limit=0.94"
