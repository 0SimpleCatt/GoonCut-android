format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.moonlight"
name = "Moonlight"
version = 1
kind = "filter"
category = "Night"
order = 111
intensity = "amount"
description = "Silvery moonlit blue, the colour nearly gone, the dark kept soft."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
