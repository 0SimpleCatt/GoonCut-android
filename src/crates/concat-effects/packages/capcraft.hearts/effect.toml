format = 2

# CapCraft's hearts. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.hearts"
name = "Hearts"
version = 1
kind = "effect"
category = "Love"
order = 84
intensity = "amount"
description = "Little hearts in pinks and reds float up the picture, swaying as they go."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
