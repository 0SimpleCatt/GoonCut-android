format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.cold-future"
name = "Cold Future"
version = 1
kind = "filter"
category = "Movies"
order = 106
intensity = "amount"
description = "A cold future: greens and cyans in the shadows, crisp and clinical."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
