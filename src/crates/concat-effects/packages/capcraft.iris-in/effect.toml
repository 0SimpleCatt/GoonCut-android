format = 2

# CapCraft's iris in. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.iris-in"
name = "Iris In"
version = 1
kind = "effect"
category = "Intro & Outro"
order = 93
description = "A circle opens from the middle out of black onto the clip."

# How long the intro takes, from the first frame of the clip or layer it is on.
[[param]]
key = "span"
label = "Duration"
min = 0.2
max = 3
default = 0.8
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
