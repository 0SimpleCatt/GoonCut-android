# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.chorus"
name = "Chorus"
kind = "audio"
category = "Tone"
order = 81
intensity = "mix"
description = "The voice doubled by slightly late, slightly detuned copies, fuller and shimmering."

[[param]]
key = "mix"
label = "Mix"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "chorus=0.6:0.9:50|60:{fixed(0.2 + mix / 25, 2)}|{fixed(0.15 + mix / 30, 2)}:0.25|0.4:2|1.3,alimiter=limit=0.94"
