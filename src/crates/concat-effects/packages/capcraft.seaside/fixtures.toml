# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from the shader as first written, so the look stays
# what it was.

[[probe]]
name = "default, skin"
input = [0.6, 0.35, 0.25, 1]
expect = [0.62793, 0.34717, 0.24084, 1.0]

[[probe]]
name = "default, a sky"
input = [0.1, 0.25, 0.6, 1]
