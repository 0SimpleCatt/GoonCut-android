format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.seaside"
name = "Seaside"
version = 1
kind = "filter"
category = "Scenery"
order = 90
intensity = "amount"
description = "Clear, cool light off the water: blues and cyans richer, highlights a touch cooler."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
