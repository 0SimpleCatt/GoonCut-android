# The probed pixel lies near the middle, so it is barely bowed or shaded,
# on the dark edge of a row and in a green column: darker, and greener.
# Nothing changes at the lowest amount. Pinned from a model of the shader in
# doubles, at the probe's pixel, worked in the display encoding.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.070907, 0.095023, 0.070907, 1]

[[probe]]
name = "default, a colour"
input = [0.6, 0.2, 0.05, 1]
expect = [0.236357, 0.105581, 0.019696, 1]

[[probe]]
name = "minimum, a grey as it was"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.033392, 0.054727, 0.033392, 1]
