format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.blue-hour"
name = "Blue Hour"
version = 1
kind = "filter"
category = "Night"
order = 112
intensity = "amount"
description = "Deep blue night, darker overall, the brights kept clear."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
