# Probed at the timeline's start on a flat frame, so the pieces that move
# stand where they first are. Pinned from the shader as first written, so
# the look stays what it was.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.13196, 0.14221, 0.16785, 1.0]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [2.93164, 0.79004, 0.0466, 1.0]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.36646, 0.15796, 0.0932, 0.5]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.15918, 0.17151, 0.20239, 1.0]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [2.39258, 0.64453, 0.03802, 1.0]
