format = 2

# CapCraft's rain. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.rain"
name = "Rain"
version = 1
kind = "effect"
category = "Nature"
order = 83
intensity = "amount"
description = "Rain streaks fall at a slant in two layers over a picture a shade darker and cooler."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
