format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.western"
name = "Western"
version = 1
kind = "filter"
category = "Movies"
order = 105
intensity = "amount"
description = "Dusty frontier light: warm and dry, the colour drained, the blacks lifted."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
