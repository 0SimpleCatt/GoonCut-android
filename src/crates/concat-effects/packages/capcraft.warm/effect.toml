# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.warm"
name = "Warm"
kind = "audio"
category = "Tone"
order = 85
intensity = "warmth"
description = "More body low down and less hiss up high: a softer, rounder voice."

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowshelf=f=250:g={fixed(warmth / 2, 2)},highshelf=f=6000:g={fixed(0 - warmth / 3, 2)},alimiter=limit=0.94"
