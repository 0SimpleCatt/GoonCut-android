format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.fresh-air"
name = "Fresh Air"
version = 1
kind = "filter"
category = "Everyday"
order = 115
intensity = "amount"
description = "A clear, bright day: a touch cooler, greens and blues livelier."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
