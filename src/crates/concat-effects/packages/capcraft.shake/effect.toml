format = 2

[effect]
id = "capcraft.shake"
name = "Shake"
version = 1
kind = "effect"
category = "Motion"
order = 1
intensity = "amount"
description = "The camera knocked about by hand: the picture pushed in a little so its edges never show, and jostled."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 80
default = 20
step = 1
unit = "px"

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 10
default = 5
step = 0.5

[wgsl]
entry = "effect.wgsl"
