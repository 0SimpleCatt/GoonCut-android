# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.monster"
name = "Monster"
kind = "audio"
category = "Voice"
order = 90
intensity = "depth"
description = "A huge, low growl of a voice in a hollow space."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
let = [
  "ratio = pow(2, (0 - 4 - depth * 0.6) / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},aecho=0.8:0.5:40:0.3,lowpass=f=5000,alimiter=limit=0.94"
