# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.alien"
name = "Alien"
kind = "audio"
category = "Voice"
order = 89
intensity = "shift"
description = "A voice from somewhere else: every frequency moved down by the same step, then swirled."

[[param]]
key = "shift"
label = "Shift"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "afreqshift=shift={fixed(0 - 100 - shift * 40, 0)},flanger=delay=3:depth=3:speed=0.5,alimiter=limit=0.94"
