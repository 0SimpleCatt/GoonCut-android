# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.flanger"
name = "Flanger"
kind = "audio"
category = "Tone"
order = 95
intensity = "depth"
description = "A jet-like whoosh riding on the sound, a copy drifting just behind it."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "flanger=delay=2:depth={fixed(1 + depth * 0.8, 1)}:speed=0.5:regen=20,alimiter=limit=0.94"
