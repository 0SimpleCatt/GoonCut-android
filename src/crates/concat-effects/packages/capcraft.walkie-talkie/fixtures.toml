[[case]]
name = "default"
chain = "highpass=f=500,lowpass=f=2800,acrusher=bits=9:mode=log:mix=0.8,acompressor=threshold=0.1:ratio=8,alimiter=limit=0.9"

[[case]]
name = "minimum"
at = "min"
chain = "highpass=f=500,lowpass=f=2800,acrusher=bits=12:mode=log:mix=0.8,acompressor=threshold=0.1:ratio=8,alimiter=limit=0.9"

[[case]]
name = "maximum"
at = "max"
chain = "highpass=f=500,lowpass=f=2800,acrusher=bits=6:mode=log:mix=0.8,acompressor=threshold=0.1:ratio=8,alimiter=limit=0.9"
