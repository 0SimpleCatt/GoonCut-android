# CapCraft's own audio effect. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.walkie-talkie"
name = "Walkie-Talkie"
kind = "audio"
category = "Voice"
order = 98
intensity = "crush"
description = "A handheld radio: thin, crunchy and squeezed loud."

[[param]]
key = "crush"
label = "Crush"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "highpass=f=500,lowpass=f=2800,acrusher=bits={fixed(12 - crush * 0.6, 0)}:mode=log:mix=0.8,acompressor=threshold=0.1:ratio=8,alimiter=limit=0.9"
