format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.thriller"
name = "Thriller"
version = 1
kind = "filter"
category = "Movies"
order = 108
intensity = "amount"
description = "Tense and grim: a sickly green cast, colour held down, deep shadows."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
