# The probed pixel lies on the top edge of its cell, and a glint keeps to
# the middle of its cell and has faded out before the edge, so none is on
# it: colour, light past white and alpha come through as they went in,
# whatever the settings.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]
