format = 2

# CapCraft's twinkle: glints that swell and fade over the picture. Written
# for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.twinkle"
name = "Twinkle"
version = 1
kind = "effect"
category = "Sparkle"
order = 75
intensity = "amount"
description = "Four-pointed glints swell and fade across the picture, each on a beat of its own."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "size"
label = "Size"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
