# At the start the orange glow sits level with the middle past the left
# edge, the red one low past the right and the yellow one above the top
# right, so the probed pixel, near the middle, takes some of each as light
# laid over it. Nothing at the lowest amount. Pinned from a model of the
# shader in doubles, at the probe's pixel and time.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.531218, 0.320598, 0.234464, 1]

[[probe]]
name = "default, a colour"
input = [0.6, 0.2, 0.05, 1]
expect = [0.951218, 0.340598, 0.104464, 1]

[[probe]]
name = "minimum, a grey as it was"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.765364, 0.414329, 0.270773, 1]
