format = 2

# CapCraft's light leak: warm light getting in at the edges, as at an old
# camera's. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.light-leak"
name = "Light Leak"
version = 1
kind = "effect"
category = "Light"
order = 73
intensity = "amount"
description = "Warm light getting in at the edges, as at an old camera's: glows that drift and swell along the sides."

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
type = "int"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
