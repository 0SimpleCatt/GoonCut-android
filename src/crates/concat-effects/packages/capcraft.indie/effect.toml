format = 2

# CapCraft's own filter. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.indie"
name = "Indie"
version = 1
kind = "filter"
category = "Movies"
order = 107
intensity = "amount"
description = "A small film's soft palette: faded, warm in the light, gentle in contrast."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
